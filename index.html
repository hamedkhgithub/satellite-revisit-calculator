<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Satellite Revisit Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Satellite Revisit Calculator v0.2</h1>
<p>Constellation optimization framework.</p>

<label>Satellites <input id="sat" value="32"></label>
<label>Planes <input id="planes" value="16"></label>
<label>Walker Phase <input id="phase" value="1"></label>

<h3>Optimization target</h3>
<label><input type="radio" name="target" value="max" checked> Minimum Maximum Revisit</label>
<label><input type="radio" name="target" value="avg"> Minimum Average Revisit</label>
<label><input type="radio" name="target" value="std"> Maximum Uniformity</label>

<br>
<button onclick="optimize()">Optimize Constellation</button>

<div id="progress"><div id="bar"></div></div>
<pre id="result"></pre>

<script src="app.js"></script>
</body>
</html>
